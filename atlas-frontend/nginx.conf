server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota não encontrada entrega o index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para o backend — só resolve na rede interna do Compose
    # (serviço "backend"). O trailing slash em proxy_pass remove o prefixo
    # /api: /api/auth/login -> http://backend:8080/auth/login.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger/OpenAPI também são servidos pelo backend, mas ele gera URLs
    # absolutas em /swagger-ui e /v3/api-docs (ex.: o redirect de
    # /swagger-ui.html). Sem esta rota, o redirect cairia no location do SPA.
    # proxy_pass sem trailing slash preserva a URI original.
    location ~ ^/(swagger-ui\.html|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
