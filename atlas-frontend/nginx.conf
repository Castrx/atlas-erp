server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers (Sprint Security & Data Integrity / L1) ---
    # Em nível de server são herdados pelos locations /api/ e swagger (que
    # não definem add_header próprio). O CSP fica SÓ no location /: a API
    # não serve HTML e o swagger tem scripts inline do backend — aplicar CSP
    # ali quebraria a UI do swagger sem ganho de segurança.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # HSTS só tem efeito quando a origem é servida por HTTPS; no HTTP puro o
    # navegador ignora o header. Mantido por segurança quando houver TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA: qualquer rota não encontrada entrega o index.html (React Router).
    # Este location define add_header próprio, então repete os demais headers
    # (o nginx não herda add_header de server quando o location define um).
    # CSP compatível com o stack: React/Vite geram bundle externo sem script
    # inline (script-src 'self'); MUI/Emotion injetam <style> em runtime
    # (style-src 'unsafe-inline'); fontsource é embarcado no bundle
    # (font-src 'self'); API é mesma origem via /api (connect-src 'self').
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Proxy reverso para o backend — só resolve na rede interna do Compose
    # (serviço "backend"). O trailing slash em proxy_pass remove o prefixo
    # /api: /api/auth/login -> http://backend:8080/auth/login.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger/OpenAPI também são servidos pelo backend, mas ele gera URLs
    # absolutas em /swagger-ui e /v3/api-docs (ex.: o redirect de
    # /swagger-ui.html). Sem esta rota, o redirect cairia no location do SPA.
    # proxy_pass sem trailing slash preserva a URI original.
    location ~ ^/(swagger-ui\.html|swagger-ui|v3/api-docs)(/|$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
