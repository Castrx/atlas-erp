name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers sobe um PostgreSQL efêmero via Docker durante os testes de integração.
      - name: Run backend tests
        run: ./mvnw test

  frontend:
    name: Frontend (Node + lint + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: atlas-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npx vitest run
