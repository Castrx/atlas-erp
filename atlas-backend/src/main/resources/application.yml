spring:
  application:
    name: atlas-erp

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlas_erp}
    username: ${DB_USERNAME:atlas}
    password: ${DB_PASSWORD:CHANGE_ME_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  # Secret de assinatura HS256. O default abaixo é um placeholder DEV-ONLY,
  # claramente fictício, apenas para o app subir em desenvolvimento sem
  # configuração. Em qualquer outro ambiente defina JWT_SECRET com um valor
  # forte (>= 32 bytes, ex.: `openssl rand -base64 48`) - ver .env.example.
  secret: ${JWT_SECRET:DEV_ONLY_CHANGE_ME_JWT_SECRET_0123456789abcdef0123456789abcdef}
  expiration: ${JWT_EXPIRATION:86400000}

admin:
  bootstrap:
    # Provisionamento do primeiro ADMIN de uma instalação nova (AE-045).
    # Ativo apenas quando ADMIN_BOOTSTRAP_EMAIL e ADMIN_BOOTSTRAP_PASSWORD
    # estiverem definidas; idempotente (não duplica se o e-mail já existir).
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    name: ${ADMIN_BOOTSTRAP_NAME:Administrador}
