services:
  postgres:
    image: postgres:17
    container_name: atlas-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: atlas_erp
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - atlas-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: atlas-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@atlas.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    networks:
      - atlas-network

volumes:
  postgres_data:

networks:
  atlas-network:
    driver: bridge