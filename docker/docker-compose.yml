services:
  postgres:
    image: postgres:17
    container_name: atlas-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas_erp}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      # Obrigatória: o compose falha rápido se não estiver definida (defina em
      # docker/.env). Aplica-se na criação do volume; nunca usa default inseguro.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatória (defina em docker/.env)}

    ports:
      # Só loopback — o postgres não fica exposto fora da máquina. O backend do
      # Compose alcança via rede interna (postgres:5432); o backend local
      # (./mvnw spring-boot:run) continua acessando via localhost:5432.
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Necessário para o backend aguardar o postgres pronto (depends_on
    # condicional não existe em docker compose — usa healthcheck).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas_erp}"]
      interval: 5s
      timeout: 5s
      retries: 12

    networks:
      - atlas-network

  backend:
    build:
      context: ../atlas-backend
    container_name: atlas-backend
    restart: unless-stopped

    environment:
      # O backend do Compose usa o postgres do próprio Compose (rede interna),
      # com as mesmas credenciais — tudo via interpolação do .env, sem
      # segredo hardcoded.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-atlas_erp}
      DB_USERNAME: ${POSTGRES_USER:-atlas}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD é obrigatória (defina em docker/.env)}
      JWT_SECRET: ${JWT_SECRET:-DEV_ONLY_CHANGE_ME_JWT_SECRET_0123456789abcdef0123456789abcdef}
      # Bootstrap do primeiro ADMIN (idempotente) — define no docker/.env
      # apenas na primeira subida; vazio = runner inerte.
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-Administrador}
      # Dados de demonstração (Sprint P4) — default false/ausente = runner
      # inerte. Defina DEMO_DATA=true no docker/.env apenas em ambiente de demo.
      DEMO_DATA: ${DEMO_DATA:-false}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - atlas-network

  frontend:
    build:
      context: ../atlas-frontend
    container_name: atlas-frontend
    restart: unless-stopped

    # nginx (porta 80 do container) exposta na 3000 do host
    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - atlas-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: atlas-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@atlas.local}
      # Obrigatória (fail-fast): defina em docker/.env; nunca usa default inseguro.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD é obrigatória (defina em docker/.env)}

    ports:
      # Só loopback — acesso de desenvolvimento em http://localhost:5050.
      - "127.0.0.1:5050:80"

    depends_on:
      - postgres

    networks:
      - atlas-network

volumes:
  # Volume DEDICADO da stack containerizada (atlas_erp_postgres_data). O volume
  # antigo (docker_postgres_data) fica preservado no disco, apenas não montado.
  postgres_data:
    name: atlas_erp_postgres_data

networks:
  atlas-network:
    driver: bridge
